name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    strategy:
      matrix:
        ocaml-compiler: ["4.14", "5.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - run: opam install . --deps-only --with-test --with-doc
      - run: opam install ocamlformat.0.29.0
      - run: opam exec -- ocamlformat --check lib/*.ml lib/*.mli test/*.ml
      - run: opam exec -- dune build -p betacalendars @runtest @doc
